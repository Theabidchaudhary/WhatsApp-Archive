name: Build debug APK

on:
  push:
    branches:
      - claude/whatsapp-archive-android-6nbiku
      - main
    paths:
      - "android/**"
      - ".github/workflows/build.yml"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install required SDK platform/build-tools
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: message-memory-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # Also publishes the APK to a dedicated, force-pushed git branch (one
      # commit, overwritten each run) so it's fetchable over plain git —
      # some environments consuming this repo can't reach the Actions
      # artifact storage host directly.
      - name: Publish APK to apk-builds branch
        run: |
          set -e
          APK_DIR="$GITHUB_WORKSPACE/android/app/build/outputs/apk/debug"
          APK_FILE=$(ls "$APK_DIR"/*.apk | head -n1)
          PUBLISH_DIR=$(mktemp -d)
          cp "$APK_FILE" "$PUBLISH_DIR/"
          cd "$PUBLISH_DIR"
          git init -q -b apk-builds
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git add "$(basename "$APK_FILE")"
          git commit -q -m "APK build from ${{ github.sha }}"
          git remote add origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          git push -f origin apk-builds

      # Runs after the APK is already built/uploaded so a test failure never
      # blocks getting the APK; still fails the workflow overall so test
      # regressions stay visible.
      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: android/app/build/reports/tests/testDebugUnitTest
          if-no-files-found: ignore
